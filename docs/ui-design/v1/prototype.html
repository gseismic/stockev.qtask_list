<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qtask_list 管理后台 · UI 设计稿 V1</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ============ tokens ============ */
/* 默认白天（浅色）；html[data-theme=dark] 切换黑夜 */
:root{
  --bg-base:#f6f8fa; --bg-surface:#ffffff; --bg-surface-2:#eef1f4;
  --border-default:#d0d7de;
  --text-primary:#1f2328; --text-secondary:#57606a; --text-faint:#6e7781;
  --c-primary:#0969da; --c-success:#1a7f37; --c-warning:#9a6700; --c-danger:#cf222e; --c-muted:#6e7781;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:18px; --fs-xl:24px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r-sm:4px; --r-md:6px; --r-lg:8px;
  --shadow-1:0 1px 3px rgba(31,35,40,.1); --shadow-2:0 8px 24px rgba(31,35,40,.18);
  --hover:rgba(31,35,40,.05); --primary-dim:rgba(9,105,218,.09);
  --overlay:rgba(31,35,40,.45);
  --danger-dim:rgba(207,34,46,.08); --danger-border:rgba(207,34,46,.45);
  --sk-a:#eef1f4; --sk-b:#e2e7ec;
}
html[data-theme="dark"]{
  --bg-base:#0d1117; --bg-surface:#161b22; --bg-surface-2:#1c2129;
  --border-default:#30363d;
  --text-primary:#e6edf3; --text-secondary:#9198a1; --text-faint:#6e7681;
  --c-primary:#2f81f7; --c-success:#3fb950; --c-warning:#d29922; --c-danger:#f85149; --c-muted:#8b949e;
  --shadow-1:0 1px 3px rgba(0,0,0,.4); --shadow-2:0 8px 24px rgba(0,0,0,.5);
  --hover:rgba(255,255,255,.04); --primary-dim:rgba(47,129,247,.08);
  --overlay:rgba(0,0,0,.55);
  --danger-dim:rgba(248,81,73,.12); --danger-border:rgba(248,81,73,.4);
  --sk-a:#1c2129; --sk-b:#242a33;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text-primary);font:var(--fs-sm)/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--text-primary);background:var(--bg-base);border:1px solid var(--border-default);border-radius:var(--r-sm);padding:6px 10px;outline:none}
input:focus,select:focus{border-color:var(--c-primary)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--c-primary);text-decoration:none;cursor:pointer}

/* ============ primitives ============ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-md);border:1px solid var(--border-default);background:var(--bg-surface-2);font-size:var(--fs-md)}
.btn:hover{border-color:var(--text-faint)}
.btn.primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.btn.danger{color:var(--c-danger);border-color:var(--danger-border)}
.btn.danger:hover{background:var(--danger-dim)}
.btn.sm{padding:2px 8px;font-size:var(--fs-xs)}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-md)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
@keyframes breathe{50%{opacity:.4}}
.dot.pulse{animation:breathe 1.6s infinite}
.skeleton{background:linear-gradient(90deg,var(--sk-a) 25%,var(--sk-b) 50%,var(--sk-a) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}

/* ============ layout ============ */
.shell{display:flex;min-height:100vh}
.sidenav{width:200px;background:var(--bg-surface);border-right:1px solid var(--border-default);padding:var(--sp-4) 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidenav .logo{padding:0 var(--sp-4) var(--sp-4);border-bottom:1px solid var(--border-default);font-weight:600;font-size:var(--fs-md)}
.sidenav .logo small{display:block;color:var(--text-faint);font-weight:400;font-size:var(--fs-xs)}
.navitem{display:flex;align-items:center;gap:10px;padding:8px var(--sp-4);color:var(--text-secondary);font-size:var(--fs-md);border-left:2px solid transparent;text-align:left;width:100%}
.navitem:hover{color:var(--text-primary);background:var(--hover)}
.navitem.active{color:var(--text-primary);border-left-color:var(--c-primary);background:var(--primary-dim)}
.navitem .count{margin-left:auto;background:var(--c-danger);color:#fff;font-size:var(--fs-xs);border-radius:10px;padding:0 6px;font-weight:600}
.main{flex:1;padding:var(--sp-5) var(--sp-6);min-width:0}
.topbar{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.topbar h1{font-size:var(--fs-xl);font-weight:600;flex:1}
.muted{color:var(--text-secondary)}.faint{color:var(--text-faint)}
.row{display:flex;gap:var(--sp-4);align-items:center}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:var(--sp-5)}
.kpi{padding:var(--sp-4)}
.kpi .v{font-size:var(--fs-xl);font-weight:600;margin-top:4px}
.kpi .lbl{color:var(--text-secondary);font-size:var(--fs-xs)}
.kpi.clickable{cursor:pointer;transition:border-color .15s,background .15s}
.kpi.clickable:hover{border-color:var(--c-primary)}
.kpi .hint{font-size:var(--fs-xs);color:var(--text-faint);margin-top:2px}

/* table */
table{width:100%;border-collapse:collapse}
th{font-size:var(--fs-xs);color:var(--text-secondary);text-align:left;padding:8px 12px;background:var(--bg-surface-2);border-bottom:1px solid var(--border-default);font-weight:500;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--border-default);font-size:var(--fs-sm)}
tbody tr:hover{background:var(--hover);cursor:pointer}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-default);margin-bottom:var(--sp-4);flex-wrap:wrap}
.tab{padding:7px 12px;color:var(--text-secondary);font-size:var(--fs-sm);border-bottom:2px solid transparent}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--text-primary);border-bottom-color:var(--c-primary)}
.tab .n{color:var(--c-danger);font-weight:600}

/* drawer */
.drawer-mask{position:fixed;inset:0;background:var(--overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;background:var(--bg-surface);border-left:1px solid var(--border-default);box-shadow:var(--shadow-2);z-index:41;display:flex;flex-direction:column}
.drawer .hd{padding:var(--sp-4);border-bottom:1px solid var(--border-default)}
.drawer .bd{flex:1;overflow:auto;padding:var(--sp-4)}
.drawer .ft{padding:var(--sp-4);border-top:1px solid var(--border-default);display:flex;gap:var(--sp-2)}
.sec{margin-bottom:var(--sp-4)}
.sec h3{font-size:var(--fs-md);margin-bottom:var(--sp-2);color:var(--text-secondary);font-weight:600}
pre.json{background:var(--bg-base);border:1px solid var(--border-default);border-radius:var(--r-sm);padding:var(--sp-3);font-size:var(--fs-xs);overflow:auto;max-height:220px;color:var(--c-primary)}

/* timeline */
.tl{list-style:none}
.tl li{position:relative;padding:0 0 var(--sp-3) 22px;border-left:1px solid var(--border-default);margin-left:5px;font-size:var(--fs-sm)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl .t{position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%}
.tl .time{color:var(--text-faint);font-size:var(--fs-xs);margin-right:8px}

/* alerts */
.alert-item{display:flex;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-default);align-items:flex-start}
.alert-item .body{flex:1}
.alert-item .title{font-size:var(--fs-md);font-weight:500}
.alert-item .meta{font-size:var(--fs-xs);color:var(--text-faint);margin-top:2px}

/* banner */
.banner{display:flex;align-items:center;gap:var(--sp-3);background:var(--danger-dim);border:1px solid var(--danger-border);color:var(--c-danger);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-4);margin-bottom:var(--sp-4);font-size:var(--fs-sm)}

/* modal */
.modal-mask{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{width:420px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-5)}
.modal h3{margin-bottom:var(--sp-3);font-size:var(--fs-lg)}
.modal p{color:var(--text-secondary);margin-bottom:var(--sp-3);font-size:var(--fs-sm)}
.modal .acts{display:flex;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-4)}

/* guide */
.guide{max-width:860px}
.guide h2{font-size:var(--fs-lg);margin:"0 0 12px";margin-top:var(--sp-6);padding-top:var(--sp-2)}
.guide h2 .anchor{color:var(--text-faint);font-size:var(--fs-xs);font-weight:400;margin-left:8px}
.guide p{color:var(--text-secondary);margin:8px 0;line-height:1.8}
.guide b,.guide strong{color:var(--text-primary)}
.guide .example{background:var(--bg-base);border:1px solid var(--border-default);border-left:3px solid var(--c-primary);border-radius:var(--r-sm);padding:10px 14px;margin:10px 0;font-size:var(--fs-sm);color:var(--text-primary)}
.guide .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}
.guide .arrow{color:var(--text-faint)}
.toc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-4)}

/* state switcher (demo) */
.demo-bar{position:fixed;bottom:16px;left:230px;z-index:20;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-3);box-shadow:var(--shadow-2);font-size:var(--fs-xs)}
.demo-bar .lab{color:var(--text-faint);margin-right:6px}
.demo-bar button{padding:2px 8px;border-radius:var(--r-sm);color:var(--text-secondary);margin-left:2px}
.demo-bar button.on{background:var(--c-primary);color:#fff}
.menu{position:absolute;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-md);box-shadow:var(--shadow-2);min-width:180px;z-index:30;padding:4px 0}
.menu button{display:block;width:100%;text-align:left;padding:7px 14px;font-size:var(--fs-sm);color:var(--text-primary)}
.menu button:hover{background:var(--hover)}
.menu button.dz{color:var(--c-danger)}
.menu .sep{border-top:1px solid var(--border-default);margin:4px 0}
.empty{padding:var(--sp-6);text-align:center;color:var(--text-secondary)}
.empty .big{font-size:var(--fs-lg);margin-bottom:var(--sp-2);color:var(--text-primary)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useMemo,useRef} = React;

/* =====================================================================
 * 组件树对应 docs/ui-design/v1/README.md §5
 * 本原型使用 mock 数据演示默认态；右下角切换器演示空/加载/错误态。
 * ===================================================================== */

// ---------- 原子组件 ----------
const Badge = ({c,children}) => {
  const color={primary:"var(--c-primary)",success:"var(--c-success)",warning:"var(--c-warning)",danger:"var(--c-danger)",muted:"var(--c-muted)"}[c];
  return <span className="badge" style={{color,border:`1px solid ${color}44`,background:`color-mix(in srgb,${color} 12%, transparent)`}}>{children}</span>;
};
const STATE_COLOR={ready:"primary",processing:"primary",retry:"warning",retry_wait:"warning",delay:"warning",completed:"success",failed:"danger",dlq:"danger",deadline_missed:"danger",expired:"danger",skipped:"muted",cancelled:"muted",history:"muted"};
const StateBadge=({s})=><Badge c={STATE_COLOR[s]||"muted"}>{s}</Badge>;

const Dot=({c,pulse})=><span className={"dot"+(pulse?" pulse":"")} style={{background:c}}/>;

const Skeleton=({h=14,w="100%",style})=><div className="skeleton" style={{height:h,width:w,...style}}/>;

// ---------- 全局状态（页面级 demo） ----------
const DEMO={ // mock 数据，正式实现来自 /api/*
  // 多 namespace、几十到上百条抓取队列的规模演示（此处 3 组 12 条 + 折叠提示）
  // done1h=最近 1 小时完成数；rate=最近完成速率(条/min)——正式实现由前端周期采样差值估算
  queues:[
    {name:"stockev:quote:5min",ns:"stockev",stats:{ready:240,processing:8,retry_wait:6,delay:12,dlq:1,completed:15230,failed:96},fail_rate:.006,done1h:720,rate:12},
    {name:"stockev:quote:1min",ns:"stockev",stats:{ready:96,processing:6,retry_wait:3,delay:0,dlq:0,completed:22010,failed:150},fail_rate:.007,done1h:960,rate:16},
    {name:"stockev:day-kline:fetch",ns:"stockev",stats:{ready:120,processing:4,retry_wait:6,delay:0,dlq:0,completed:8421,failed:168},fail_rate:.02,done1h:480,rate:8},
    {name:"stockev:adjust:dividend",ns:"stockev",stats:{ready:12,processing:1,retry_wait:0,delay:0,dlq:0,completed:512,failed:3},fail_rate:.006,done1h:66,rate:1.1},
    {name:"stockev:universe:am",ns:"stockev",stats:{ready:500,processing:0,retry_wait:0,delay:0,dlq:0,completed:88,failed:1},fail_rate:.011,done1h:20,rate:0},
    {name:"stockev:store",ns:"stockev",stats:{ready:2,processing:1,retry_wait:0,delay:0,dlq:0,completed:15022,failed:12},fail_rate:.001,done1h:940,rate:15.7},
    {name:"news:discover",ns:"news",stats:{ready:0,processing:0,retry_wait:0,delay:0,dlq:0,completed:312,failed:0},fail_rate:0,done1h:0,rate:0},
    {name:"news:fetch",ns:"news",stats:{ready:0,processing:0,retry_wait:0,delay:0,dlq:0,completed:1204,failed:2},fail_rate:.002,done1h:0,rate:0},
    {name:"bf:kline:2024",ns:"backfill",stats:{ready:6200,processing:35,retry_wait:12,delay:0,dlq:0,completed:3100,failed:52},fail_rate:.017,done1h:2700,rate:45},
    {name:"bf:kline:2023",ns:"backfill",stats:{ready:8600,processing:30,retry_wait:8,delay:0,dlq:0,completed:2400,failed:41},fail_rate:.017,done1h:2200,rate:37},
    {name:"bf:tick:2024H1",ns:"backfill",stats:{ready:420,processing:18,retry_wait:2,delay:0,dlq:3,completed:980,failed:22},fail_rate:.022,done1h:610,rate:10.2},
    {name:"bf:tick:2023H1",ns:"backfill",stats:{ready:0,processing:0,retry_wait:0,delay:0,dlq:0,completed:150,failed:0},fail_rate:0,done1h:0,rate:0},
  ],
  workers:[
    {worker_id:"fetch-3",queue:"stockev:quote:5min",heartbeat:"2s 前",stale:false,processing:2},
    {worker_id:"fetch-4",queue:"stockev:quote:5min",heartbeat:"3s 前",stale:false,processing:0},
    {worker_id:"kline-1",queue:"stockev:day-kline:fetch",heartbeat:"8min 前",stale:true,processing:3},
    {worker_id:"news-1",queue:"stockev:news:fetch",heartbeat:"5s 前",stale:false,processing:1},
  ],
  alerts:[
    {sev:"danger",rule:"dlq",title:"stockev:quote:5min 的死信队列出现 1 条任务",time:"10:02"},
    {sev:"danger",rule:"worker",title:"Worker kline-1 心跳超时（最后心跳 08:12）",time:"08:15"},
    {sev:"warning",rule:"failed%",title:"stockev:day-kline:fetch 最近 50 条失败率 8%（阈值 5%）",time:"07:40"},
  ],
  tasks:[
    {task_id:"8f3ac2e1",action:"fetch_quote",attempt:2,state:"retry_wait",created:"10:00:05",done:"—",payload:'{symbol:"AAPL",slot:"20260921T1000"}'},
    {task_id:"91bd47fe",action:"fetch_quote",attempt:1,state:"completed",created:"09:55:00",done:"09:55:02",payload:'{symbol:"MSFT",slot:"20260921T0955"}'},
    {task_id:"c02d9a11",action:"fetch_quote",attempt:1,state:"processing",created:"10:00:05",done:"—",payload:'{symbol:"NVDA",slot:"20260921T1000"}'},
    {task_id:"77e0b345",action:"store_price",attempt:1,state:"completed",created:"09:55:02",done:"09:55:03",payload:'{symbol:"MSFT",price:431.2}'},
    {task_id:"aa19f802",action:"fetch_quote",attempt:3,state:"dlq",created:"09:40:00",done:"—",payload:'{symbol:"TSLA",slot:"20260921T0940"}'},
    {task_id:"bd63ce70",action:"fetch_quote",attempt:1,state:"deadline_missed",created:"09:35:00",done:"—",payload:'{symbol:"AMD",slot:"20260921T0935"}'},
  ],
  redis:{used:"1.2G",peak:"1.4G",threshold:"2G",pct:62},
};

const AppCtx=React.createContext(null);

// ---------- AppShell ----------
function SideNav(){
  const {page,setPage,alerts}=React.useContext(AppCtx);
  const items=[["overview","◈ 总览"],["queues","▤ 队列"],["tasks","☰ 任务"],["workers","◉ Worker"],["alerts","◆ 告警"],["guide","✎ 教程"]];
  return <nav className="sidenav">
    <div className="logo">qtask_list<small>管理后台 · 设计稿 V1</small></div>
    {items.map(([k,label])=>
      <button key={k} className={"navitem"+(page===k?" active":"")} onClick={()=>setPage(k)}>
        {label}{k==="alerts"&&alerts.length>0&&<span className="count">{alerts.length}</span>}
      </button>)}
    <div style={{marginTop:"auto",padding:"12px 16px",fontSize:"var(--fs-xs)"}} className="faint">
      <Dot c="var(--c-success)"/> 已连接 redis://…6379/0
    </div>
  </nav>;
}
function ThemeToggle(){
  const {theme,setTheme}=React.useContext(AppCtx);
  const dark=theme==="dark";
  return <button className="btn sm" title="切换白天/黑夜模式" onClick={()=>setTheme(dark?"light":"dark")}>{dark?"切换白天":"切换黑夜"}</button>;
}
function TopBar({title,children}){
  return <div className="topbar"><h1>{title}</h1>{children}<ThemeToggle/></div>;
}

// ---------- 进度工具 ----------
const remaining=q=>q.stats.ready+q.stats.processing+(q.stats.retry_wait||0)+(q.stats.delay||0);
const etaText=q=>{const rem=remaining(q);if(rem<=0)return"完成";if(!q.rate)return"停滞";const m=rem/q.rate;return m<1?"<1min":m<60?`约 ${Math.round(m)}min`:`约 ${(m/60).toFixed(1)}h`;};
const isAbnormal=q=>q.stats.dlq>0||q.fail_rate>.05||(!q.rate&&remaining(q)>0);
const healthOf=q=>q.stats.dlq>0?["danger",`DLQ ${q.stats.dlq}`]:(!q.rate&&remaining(q)>0)?["danger","停滞"]:q.fail_rate>.05?["warning","失败率"]:remaining(q)>0?["success","进行中"]:["muted","空闲"];
function ProgressBar({q,w=120}){
  const rem=remaining(q),tot=q.done1h+rem||1;
  const dw=Math.min(100,q.done1h/tot*100),rw=rem/tot*100,dw2=Math.min(100-q.done1h/tot*100,q.stats.dlq/tot*100);
  return <div style={{display:"flex",alignItems:"center",gap:8}}>
    <div style={{display:"flex",height:6,flex:`0 0 ${w}px`,background:"var(--bg-base)",borderRadius:3,overflow:"hidden"}}>
      <div style={{width:`${dw}%`,background:"var(--c-success)"}}/>
      <div style={{width:`${rw}%`,background:"var(--c-primary)",opacity:.35}}/>
      {q.stats.dlq>0&&<div style={{width:`${dw2}%`,background:"var(--c-danger)"}}/>}
    </div>
    <span className="num faint" style={{fontSize:"var(--fs-xs)"}}>{Math.round(q.done1h/tot*100)}%</span>
  </div>;
}

// ---------- 总览（进度总览） ----------
function OverviewPage(){
  const {queues,alerts,mode,setPage,setQueueListFilter}=React.useContext(AppCtx);
  const [matrixView,setMatrixView]=useState("all");
  const active=queues.filter(q=>remaining(q)>0).length;
  const totalRem=queues.reduce((a,q)=>a+remaining(q),0);
  const totalRate=queues.reduce((a,q)=>a+q.rate,0);
  const abnormal=queues.filter(isAbnormal).length;
  const goQueuesActive=()=>{setQueueListFilter("active");setPage("queues");};
  const goMatrixAbnormal=()=>{
    setMatrixView("abnormal");
    const el=document.getElementById("matrix-anchor");
    el&&el.scrollIntoView({behavior:"smooth",block:"start"});
  };
  return <div>
    <TopBar title="总览"><span className="faint" style={{fontSize:"var(--fs-xs)"}}>自动刷新 5s · 上次 10:02:31</span></TopBar>
    {mode==="error"&&<div className="banner">⚠ Redis 连接失败: Connection refused — <a>重试</a></div>}
    <div className="kpis">
      {mode==="loading"
        ? [0,1,2,3].map(i=><div key={i} className="card kpi"><Skeleton h={28} w={60}/><div style={{marginTop:8}}><Skeleton h={10} w={80}/></div></div>)
        : <>

function QueueHealthMatrix({view,setView}){
  const {queues,mode,setPage}=React.useContext(AppCtx);
  const [collapsed,setCollapsed]=useState(()=>{const byNs={};queues.forEach(q=>byNs[q.ns]=(byNs[q.ns]||0)+remaining(q));const c={};Object.entries(byNs).forEach(([g,v])=>{if(v===0)c[g]=true});return c;});
  const withMeta=queues.map(q=>({...q,rem:remaining(q)}));
  const filtered=withMeta.filter(q=>view==="all"||(view==="active"?q.rem>0:isAbnormal(q)));
  const groups={};filtered.forEach(q=>{(groups[q.ns]=groups[q.ns]||[]).push(q)});
  const gkeys=Object.keys(groups).sort();
  const toggle=g=>setCollapsed(c=>({...c,[g]:!c[g]}));
  return <div className="card">
    <div style={{padding:"12px 16px",borderBottom:"1px solid var(--border-default)",display:"flex",alignItems:"center",gap:"var(--sp-4)"}}>
      <span style={{fontWeight:600,fontSize:"var(--fs-md)"}}>队列进度矩阵</span>
      <span style={{flex:1}}/>
      {["all","active","abnormal"].map(f=><button key={f} className="btn sm" style={view===f?{borderColor:"var(--c-primary)",color:"var(--c-primary)"}:null} onClick={()=>setView(f)}>{({all:"全部",active:"进行中",abnormal:"仅异常"})[f]}</button>)}
      <span className="faint" style={{fontSize:"var(--fs-xs)"}} title="绿=最近 1h 完成，蓝=剩余（ready+processing+retry_wait+delay），红=DLQ">进度条说明</span>
    </div>
    {mode==="loading"
      ? <div style={{padding:16}}>{[0,1,2].map(i=><Skeleton key={i} h={20} style={{marginBottom:12}}/>)}</div>
      : mode==="empty" ? <div className="empty"><div className="big">还没有队列</div>用 <code>qtask push</code> 或在队列页投递第一条任务，这里会出现队列健康概览。</div>
      : <table><thead><tr><th>队列</th><th>进度</th><th className="num">剩余</th><th className="num">完成/1h</th><th className="num">速率/min</th><th>预计完成</th><th>状态</th></tr></thead>
      <tbody>{gkeys.map(g=>{
        const gq=groups[g];
        const gRem=gq.reduce((a,q)=>a+q.rem,0),gDone=gq.reduce((a,q)=>a+q.done1h,0);
        const gAbn=gq.filter(isAbnormal).length;
        const sorted=[...gq].sort((a,b)=>(isAbnormal(b)-isAbnormal(a))||(b.rem-a.rem));
        const isCol=collapsed[g];
        return [
          <tr key={`g-${g}`} className="group-row" onClick={()=>toggle(g)} style={{cursor:"pointer",background:"var(--bg-surface-2)"}}>
            <td colSpan={7} style={{fontWeight:600,fontSize:"var(--fs-xs)",padding:"7px 12px",color:"var(--text-secondary)"}}>
              {isCol?"▸":"▾"} {g} · {gq.length} 个队列 · 剩余 {gRem.toLocaleString()} · 完成/1h {gDone.toLocaleString()}{gAbn>0?` · ⚠ ${gAbn} 个异常`:null}
            </td>
          </tr>,
          ...(!isCol?sorted.map(q=>{
            const [hc,ht]=healthOf(q);
            return <tr key={q.name} onClick={()=>setPage("detail")}>
            <td style={{fontWeight:500}}>{q.name}</td>
            <td><ProgressBar q={q}/></td>
            <td className="num" style={q.rem>0?{color:"var(--c-primary)",fontWeight:600}:null}>{q.rem||"-"}</td>
            <td className="num">{q.done1h||"-"}</td>
            <td className="num">{q.rate||"-"}</td>
            <td className="num" style={!q.rate&&q.rem>0?{color:"var(--c-danger)",fontWeight:600}:null}>{etaText(q)}</td>
            <td><Badge c={hc}>{ht}</Badge></td>
          </tr>;}):[])
        ];
      })}</tbody></table>}
  </div>;
}

        </div>
        <div className="sec"><h3>Result</h3>
          {terminal&&t.state!=="completed"
            ? <div className="faint" style={{fontSize:"var(--fs-sm)"}}>任务尚无结果（未成功完成）</div>
            : <pre className="json">{'{\n  "price": 254.32,\n  "fetched_at": "…"\n}'}</pre>}
        </div>
        <div className="sec"><h3>血缘</h3>
          <div style={{fontSize:"var(--fs-sm)"}} className="muted">replay_of <a>91bd47fe ↗</a> · 未重放</div>
        </div>
      </div>
      <div className="ft">
        {t.state==="dlq"&&<button className="btn" onClick={()=>confirm("从 DLQ 重入队","将创建新 task_id 重新入队，原记录保留。")}>从 DLQ 重入队</button>}
        {terminal&&<button className="btn primary" onClick={()=>confirm("重放为新任务","将创建新 task_id 从 attempt=0 重新执行，原任务保持终态。")}>重放为新任务</button>}
        <span style={{flex:1}}/>
        <button className="btn danger" onClick={()=>confirm("删除任务",`将删除任务 ${t.task_id} 及其历史记录。`)}>删除</button>
      </div>
    </div>
  </>;
}

// ---------- 教程 ----------
function GuidePage(){
  const toc=[
    ["g-30s","30 秒总览"],["g-task-queue","任务和队列的关系"],["g-life","任务的一生（状态）"],
    ["g-numbers","关键数字怎么读"],["g-dedup","去重：同一件事只干一次"],["g-worker","Worker 与心跳"],
    ["g-ops","日常操作怎么做"],["g-pages","后台各页是干嘛的"]];
  return <div className="guide">
    <TopBar title="教程"><span className="faint" style={{fontSize:"var(--fs-xs)"}}>说人话的概念手册 · 给第一次用的人看</span></TopBar>
    <div className="toc">{toc.map(([id,label])=><a key={id} className="btn sm" href={"#"+id}>{label}</a>)}</div>

    <h2 id="g-30s">30 秒总览<a className="anchor" href="#g-30s">#</a></h2>
    <p>你的程序把要干的活（<b>任务</b>）扔进<b>队列</b>；<b>Worker</b> 是干活的工人，从队列里领任务、执行、报结果。失败了会自动重试几次，重试还不行就扔进<b>死信队列（DLQ）</b>等管理员处理。这个后台就是让你<b>看得见</b>（进度/告警）和<b>管得了</b>（重放/恢复/清理）。</p>
    <div className="example">你的程序 ──投递──▶ 队列(排队) ──领取──▶ Worker 执行 ──┬──▶ 完成 ✓<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└─失败─▶ 等一会重试 ──重试用尽─▶ 死信 DLQ ⚠</div>

    <h2 id="g-task-queue">任务和队列的关系<a className="anchor" href="#g-task-queue">#</a></h2>
    <p><b>队列</b>是一条流水线的名字，代表一类活，比如 <code>stockev:day-kline:fetch</code> 就是"抓日 K 线"这条流水线。名字里的 <code>stockev</code> 是 <b>namespace</b>，相当于项目/业务的分组前缀，方便把不同业务的队列分开管理。</p>
    <p><b>任务</b>是流水线里一条具体的活，比如"抓 AAPL 2026-09-19 这一天的日 K"。</p>
    <div className="example">一个队列 = 一类活（可能有几十到几万条任务）<br/>一条任务 = 这类活里的一件具体的事<br/>后台里：总览/队列页看的是"流水线"，点进去的任务表格看的是"每件事"</div>
    <p>所以你说的"几百个任务在跑"，在这个后台里通常对应几十上百个<b>队列</b>；每条队列自己的进度在总览的进度矩阵里看，单条任务的明细进队列详情搜。</p>

    <h2 id="g-life">任务的一生（状态）<a className="anchor" href="#g-life">#</a></h2>
    <p>一条任务从投递到结束，只会在下面几个状态之间流转：</p>
    <div className="flow">
      <Badge c="primary">ready 排队中</Badge><span className="arrow">→</span>
      <Badge c="primary">processing 执行中</Badge><span className="arrow">→</span>
      <Badge c="success">completed 完成</Badge>
    </div>
    <p>失败的话：</p>
    <div className="flow">
      <Badge c="primary">processing</Badge><span className="arrow">→</span>
      <Badge c="warning">retry_wait 等着重试</Badge><span className="arrow">→</span>
      <span className="faint">(30s → 1min → … 越等越久)</span><span className="arrow">→</span>
      <Badge c="primary">processing</Badge><span className="arrow">→</span>…
      <span className="arrow">重试用尽 →</span><Badge c="danger">dlq 死信</Badge>
    </div>
    <p>其他状态：<Badge c="warning">delay 定时</Badge> 投递时说好"晚点再干"；<Badge c="danger">deadline_missed/skipped 过期</Badge> 排队太久，错过了最晚开始时间，跳过不干；<Badge c="muted">cancelled 取消</Badge> 被管理操作取消。</p>
    <div className="example">一句话：<b>ready/delay/retry_wait = 还没干；processing = 正在干；completed/failed/dlq/skipped = 干完了（不管好坏）。</b></div>

    <h2 id="g-numbers">关键数字怎么读<a className="anchor" href="#g-numbers">#</a></h2>
    <p><b>attempt</b>：这已经是第几次尝试。<code>max_retry=3</code> 的意思是<b>总共最多干 3 次</b>（不是失败后再试 3 次）。</p>
    <p><b>剩余</b> = ready + processing + retry_wait + delay，即"还没干完的总数"。</p>
    <p><b>速率</b>：后台每隔几秒数一次"完成了多少"，取差值估算出条/min——所以刚打开页面会有约 10 秒显示"—"。</p>
    <p><b>ETA（预计完成）</b> = 剩余 ÷ 速率。速率掉到 0 但还有剩余 = <b>停滞</b>（红色），多半是 Worker 挂了或堵住了，去告警页看。</p>

    <h2 id="g-dedup">去重：同一件事只干一次<a className="anchor" href="#g-dedup">#</a></h2>
    <p>定时任务每 5 分钟投一轮，如果上一轮还没干完，下一轮再投岂不是重复？靠的是 <b>logical_key（身份键）</b>：同一条"身份"的任务在途时，再投会被挡掉。键里编了时间桶（如 <code>quote:AAPL:20260921T1000</code>），所以"上一分钟"和"这一分钟"天然是两件事，不会被误挡。</p>

    <h2 id="g-worker">Worker 与心跳<a className="anchor" href="#g-worker">#</a></h2>
    <p>Worker 每隔几秒报一次平安（<b>心跳</b>）。如果超过一段时间没报（比如程序被 kill -9），它手里"执行中"的任务就成了没人管的孤儿——系统会把它标记为<b>失联</b>，这些任务可以被<b>恢复</b>（放回队列重新干）。所以崩溃不丢任务，但同一件事可能被干两次，落库代码要写成"重复干也没事"（幂等）。</p>

    <h2 id="g-ops">日常操作怎么做<a className="anchor" href="#g-ops">#</a></h2>
    <p>后台里的按钮和它们的适用时机：</p>
    <table style={{margin:"8px 0"}}>
      <thead><tr><th>场景</th><th>去哪</th><th>干什么</th></tr></thead>
      <tbody>
        <tr><td>DLQ 涨了（任务反复失败）</td><td>队列详情 → dlq 标签</td><td>先看失败原因（任务详情），修完点「重放」再给一次机会</td></tr>
        <tr><td>Worker 失联</td><td>Worker 页</td><td>确认人真没了再点「恢复任务」，任务会放回队列</td></tr>
        <tr><td>过期任务一堆</td><td>队列详情 deadline_missed</td><td>「重放并改截止时间」，把最晚开始时间推到未来</td></tr>
        <tr><td>队列不要了</td><td>队列卡片「操作▾」</td><td>清空（危险，二次确认）；连历史一起删用「删除队列」</td></tr>
        <tr><td>想试试通不通</td><td>队列页「+ 投递测试任务」</td><td>投一条测试任务看能不能正常走完</td></tr>
      </tbody>
    </table>

    <h2 id="g-pages">后台各页是干嘛的<a className="anchor" href="#g-pages">#</a></h2>
    <p><b>总览</b>=盯盘，看全部流水线进度和异常；<b>队列</b>=流水线管理入口（操作都在这）；<b>任务</b>=跨队列搜某条任务；<b>Worker</b>=工人状态；<b>告警</b>=出事自动提醒，可定位。</p>
  </div>;
}

// ---------- 确认弹窗 ----------
function ConfirmDialog(){
  const {dialog,closeDialog}=React.useContext(AppCtx);
  if(!dialog)return null;
  return <div className="modal-mask" onClick={closeDialog}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>{dialog.title}</h3><p>{dialog.body}</p>
      <div className="acts"><button className="btn" onClick={closeDialog}>取消</button><button className="btn danger" onClick={closeDialog}>确认执行</button></div>
    </div>
  </div>;
}

// ---------- App ----------
function App(){
  const [page,setPage]=useState("overview");
  const [drawer,setDrawer]=useState(null);
  const [dialog,setDialog]=useState(null);
  const [mode,setMode]=useState("default");
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("qtask-theme")||"light"}catch(e){return "light"}});
  const [queueListFilter,setQueueListFilter]=useState("all");
  useEffect(()=>{
    document.documentElement.dataset.theme=theme;
    try{localStorage.setItem("qtask-theme",theme)}catch(e){}
  },[theme]);
  const ctx={page,setPage,queues:DEMO.queues,workers:DEMO.workers,alerts:DEMO.alerts,tasks:DEMO.tasks,mode,
    theme,setTheme,
    drawer,dialog,openDrawer:setDrawer,closeDrawer:()=>setDrawer(null),
    queueListFilter,setQueueListFilter,
    confirm:(title,body)=>setDialog({title,body}),closeDialog:()=>setDialog(null)};
  return <AppCtx.Provider value={ctx}>
    <div className="shell">
      <SideNav/>
      <main className="main">
        {page==="overview"&&<OverviewPage/>}
        {page==="queues"&&<QueueListPage/>}
        {page==="tasks"&&<TasksPage/>}
        {page==="workers"&&<WorkersPage/>}
        {page==="alerts"&&<AlertsPage/>}
        {page==="detail"&&<QueueDetailPage/>}
        {page==="guide"&&<GuidePage/>}
        {page!=="detail"&&page!=="overview"&&page!=="queues"&&<div/>}
      </main>
    </div>
    <TaskDrawer/><ConfirmDialog/>
    <div className="demo-bar">
      <span className="lab">演示状态：</span>
      {[["default","默认"],["loading","加载"],["error","错误"],["empty","空"],["detail","队列详情页"]].map(([k,l])=>
        <button key={k} className={mode===k||(k==="detail"&&page==="detail")?"on":""} onClick={()=>{if(k==="detail"){setMode("default");setPage("detail");}else{setPage("overview");setMode(k);}}}>{l}</button>)}
    </div>
  </AppCtx.Provider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
